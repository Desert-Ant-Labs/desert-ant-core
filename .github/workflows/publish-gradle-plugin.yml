name: Publish Gradle plugin

# Publish the ai.desertant model-SDK Gradle plugin to Maven Central when a
# release tag (vX.Y.Z) is pushed, but only if it actually changed. Pure JVM (no
# Android SDK), so it just runs `mise run publish-plugin`. Credentials come from
# the Desert-Ant-Labs organization secrets (MAVEN_CENTRAL_* / SIGNING_IN_MEMORY_*).
# The `maven-central` environment below holds no secrets; it is kept only as an
# optional approval gate. Never add a secret to it - environment secrets shadow
# organization ones.
#
# Same publish-on-change model as the other artifacts: `mise run set-version`
# bumps every version, the tag names the release, and this publishes only when
# gradle-plugin/ changed since the previous tag (a pure version bump does not
# count). Published versions may skip.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-gradle-plugin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: should this tag publish the Gradle plugin?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.g.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to diff against the previous tag

      - id: g
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' gradle-plugin/build.gradle.kts)
          [ -n "$VERSION" ] || { echo "no version in gradle-plugin/build.gradle.kts" >&2; exit 1; }

          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "tag ${TAG} != plugin ${VERSION}; skipping (not this artifact's release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # One version across the repo: every artifact publishes at every tag.
          publish=true
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the Gradle plugin to Maven Central
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: mise run publish-plugin
