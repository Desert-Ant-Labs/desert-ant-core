name: Release

# Push a tag, release everything.
#
#   mise run set-version X.Y.Z && jj commit && <push> && <push tag vX.Y.Z>
#
# Every artifact in the repo ships one version (VERSION), so there is nothing to
# decide at release time: no per-artifact change detection, no "did core land on
# Central yet" wait, no per-model pipeline. The tag names the version, the gate
# proves the checkout agrees, and the three publish jobs run.
#
#   GitHub Release  the tag is the SwiftPM release, so it always gets one
#   Maven Central   ai.desertant:{model-sdk-gradle-plugin,core,<model>...}
#   npm             @desert-ant-labs/{core,<model>...}
#
# Every publish task is re-runnable: an artifact already live at this version is
# skipped, so a half-failed tag can simply be re-run.
#
# Credentials are Desert-Ant-Labs organization secrets (visibility `all`):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD    Central portal token
#   SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_PASSWORD   GPG signing key
#   NPM_TOKEN                                          npm automation token
# The `maven-central` and `npm` environments below hold no secrets; they exist
# only as optional approval gates and for deployment history. Never put a secret
# in them - environment secrets shadow organization ones.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds every publishable artifact, publishes none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release

jobs:
  gate:
    name: does this tag match VERSION?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
      - id: gate
        run: |
          set -euo pipefail
          version=$(mise run check:version | tail -1)
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "manual run: dry-running the build paths at $version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ($version)"
            exit 1
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  maven:
    name: Maven Central (plugin, core, every model AAR)
    needs: gate
    # Same runner as CI's android job, so the toolchain the release uses is the
    # one CI proves. The snapshot Swift toolchain is per Ubuntu release: the
    # 24.04 build links GLIBC 2.38 and will not run here (build:android-natives
    # picks the matching tarball, and the cache key below follows the runner).
    runs-on: ubuntu-22.04
    environment: maven-central
    # A release ships every AAR whole: this opts the Android tasks into the
    # models CI defers (dal_android_deferred in Tools/dal.sh), so voz's natives
    # are cross-compiled here even though the CI matrix never builds them.
    env:
      DAL_LONG_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
      - name: Swift toolchain system deps
        run: |
          # These three are already on the ubuntu-22.04 runner image, so the
          # common path installs nothing and never touches the network. That
          # matters: apt can wedge on a bad mirror, sitting on `update` until the
          # job's 6 h timeout rather than failing. Bound each attempt and retry, so a bad mirror costs
          # seconds and a retry instead of the run. Retrying rather than just
          # `timeout-minutes`: that would still lose the run to a manual re-run,
          # which is the toil this is here to remove.
          #
          # `sudo timeout`, not `timeout sudo`: the latter runs the killer as the
          # runner user, which cannot signal the root apt-get it is trying to
          # stop (EPERM), so the hang survives its own timeout. -k follows up
          # with SIGKILL for an apt wedged past SIGTERM.
          pkgs="libcurl4-openssl-dev libxml2-dev zlib1g-dev"
          missing=""
          for p in $pkgs; do
            dpkg -s "$p" > /dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "already on the runner image: $pkgs"
            exit 0
          fi
          echo "missing:$missing"
          for attempt in 1 2 3; do
            if sudo timeout -k 10 120 apt-get update -qq \
              && sudo timeout -k 10 180 apt-get install -y -qq --no-install-recommends $missing; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt timed out or failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::apt failed after 3 attempts"
          exit 1
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
      # v7 is the newest floating major tag this action publishes (its later
      # releases ship no vN alias), and it already runs on node24.
      - uses: astral-sh/setup-uv@v7
        with:
          # uv only unpacks a wheel here; there is no uv.lock or
          # requirements.txt to key a cache on, and asking for one warns
          # that it can never be invalidated.
          enable-cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/desert-ant/toolchains
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
            Vendor/litert
          key: swift-android-6.4.x-2026-07-17-a-ubuntu-22.04-api24-litert-2.2.0

      # Its own step: Gradle's Exec task swallows the underlying mise stderr,
      # which makes a failure in the cross-compile undiagnosable.
      - run: mise run build:android-natives
      - run: mise run build:android

      - name: Publish
        if: needs.gate.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: mise run publish:maven

  # The npm packages ship a prebuilt native core per server-side target. Cross-OS
  # builds are not possible, so each is built on its own runner and gathered by
  # the publish job. Linux builds inside an Amazon Linux 2 image (glibc 2.26,
  # libstdc++ GLIBCXX_3.4.24) so the libs built here never raise the floor the
  # vendored LiteRT already sets: glibc 2.28 on x64, which is Ubuntu 20.04+,
  # Debian 11+ and AWS Lambda's managed Node runtimes (Amazon Linux 2023), and
  # 2.34 on arm64, whose LiteRT wheel links newer than its tag says. The image
  # also supplies the Swift toolchain.
  #
  # The image runs under `docker run` rather than as the job's `container:`.
  # The runner executes JavaScript actions (checkout, mise, upload-artifact) with
  # its own Node inside the job container, and that Node needs glibc 2.28, so
  # none of them would start on Amazon Linux 2. They run on the host instead, and
  # only the build itself enters the image.
  natives:
    name: native ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Image glibc must stay <= 2.28 and libstdc++ <= GLIBCXX_3.4.25, which
          # build:node-native checks; rhel-ubi9 (glibc 2.34, GLIBCXX_3.4.29)
          # shipped the 3.3.1 natives, which Ubuntu 20.04 cannot load. Newer
          # runner images are fine: the image pins libc.
          - { target: linux-x64, runner: ubuntu-24.04, image: "swift:6.3.3-amazonlinux2" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, image: "swift:6.3.3-amazonlinux2" }
          # CI's `darwin-native` job uses the same runner, so the toolchain that
          # ships is the one CI proves. macos-14's Swift 5.10 predates the
          # package's 6.2 requirement.
          #
          # The runner does not set the Apple floor either way: that comes from the
          # Core ML models, built for macOS 15 / iOS 18. macOS 14 refuses to load
          # them ("compiler major version for compiled model is 9.0.0 and is more
          # recent than this framework major version 8.0.0"), macOS 15 and 26 both
          # accept them.
          - { target: darwin-arm64, runner: macos-26 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The Linux build mounts the checkout into a container; nothing there
          # should find a write token in .git/config.
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
      - uses: astral-sh/setup-uv@v7
        with:
          # uv only unpacks a wheel here; there is no uv.lock or
          # requirements.txt to key a cache on, and asking for one warns
          # that it can never be invalidated.
          enable-cache: false
      - if: matrix.target == 'darwin-arm64'
        run: mise run build:node-native
      # LiteRT is vendored on the host, where uv is, and the image finds it
      # already in place. The image already carries git, cc, binutils and the
      # curl, libxml2 and zlib dev packages that static Foundation autolinks.
      # The task runs as a plain script because mise is a host tool too, and
      # mise sets nothing build:node-native reads. safe.directory because the
      # checkout belongs to the runner user, not the image's root.
      - name: Build in ${{ matrix.image }}
        if: startsWith(matrix.target, 'linux')
        run: |
          set -euo pipefail
          bash -c 'source Tools/dal.sh && dal_vendor_litert'
          docker run --rm -v "$PWD:/w" -w /w -e MISE_PROJECT_ROOT=/w "${{ matrix.image }}" bash -c '
            set -euo pipefail
            git config --global --add safe.directory "*"
            bash mise-tasks/build/node-native'
      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.target }}
          path: packages/*-node/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1

  npm:
    name: npm (core and every model package)
    needs: [gate, natives]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
      - uses: astral-sh/setup-uv@v7
        with:
          # uv only unpacks a wheel here; there is no uv.lock or
          # requirements.txt to key a cache on, and asking for one warns
          # that it can never be invalidated.
          enable-cache: false

      # Gather every prebuilt native back into its package, so each tarball
      # carries all three server-side targets.
      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: /tmp/natives
          merge-multiple: true
      - name: Stage the natives
        run: |
          set -euo pipefail
          # upload-artifact roots each artifact at the common ancestor of its
          # matched files, i.e. packages/, so this is <model>-node/native/... .
          cp -a /tmp/natives/. packages/
          find packages/*-node/native -type f | sort
          # The same helpers build:node-native uses to skip a model, so the
          # check expects exactly the natives that job was asked to build: a
          # pure package (tongue) and a wasm-only one (voz) ship none.
          source Tools/dal.sh
          for model in $(dal_models_with node); do
            dal_node_pure "$model" && continue
            dal_node_wasm_only "$model" && continue
            dir="packages/$model-node"
            for target in linux-x64 linux-arm64 darwin-arm64; do
              [ -d "$dir/native/$target" ] || { echo "::error::$dir is missing the $target native"; exit 1; }
            done
          done

      # The browser half of every package.
      - run: mise run build:wasm

      # A pure package's `prepare` builds its dist from TypeScript at publish
      # time, which needs the workspace devDependencies on the PATH.
      - run: mise run npm-install

      - name: Publish
        if: needs.gate.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise run publish:npm

  release:
    name: GitHub Release
    needs: [gate, maven, npm]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: mise run publish:github
