name: macOS

on:
  push:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Set up mise
        uses: jdx/mise-action@v2

      # No model artifact is committed, so the model-backed suites download the
      # pinned revision from the Hub on a cold cache. Cache the store so that
      # happens once per revision instead of once per push, which also keeps the
      # run independent of Hugging Face being reachable. Each model's pinned
      # revision lives in its Catalog.swift, so those files are the cache key.
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/desert-ant-models
          key: models-${{ runner.os }}-${{ hashFiles('Sources/*/Catalog.swift') }}
          restore-keys: models-${{ runner.os }}-

      - name: Verify Emo has no audio or unrelated model dependency
        run: |
          swift package clean
          swift build --target Emo -v 2>&1 | tee /tmp/emo-build.log
          if grep -Eq 'Sources/(AudioDSP|AudioIO|Clear|Redact)/' /tmp/emo-build.log; then
            echo "Emo compiled an unrelated target" >&2
            exit 1
          fi

      # `mise run test-macos` runs the suite with the Xcode toolchain.
      - name: Test
        run: mise run test-macos
