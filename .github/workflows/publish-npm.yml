name: Publish npm

# Publish the @desert-ant-labs/core npm package on a release tag (vX.Y.Z). Pure
# JS, no build step, so it just runs `mise run publish-npm`. The token comes from
# the Desert-Ant-Labs organization secrets.
#
# Release model: `mise run set-version X.Y.Z` sets ONE version across every
# artifact in the repo, you commit and push `vX.Y.Z`, and everything publishes at
# it. The model packages pin core exactly, so a mismatched pair cannot exist.
#
# Organization secret, visibility `all` (set once for the whole org with
# `gh secret set NPM_TOKEN --org Desert-Ant-Labs --visibility all`), so every SDK
# repo - including new model SDKs, with no per-repo setup - publishes with the
# same credential and there is one place to rotate it:
#   NPM_TOKEN  npm automation token with publish rights on @desert-ant-labs
#
# The `npm` environment below holds no secrets; it is kept only as an optional
# approval gate and for deployment history. Never add a secret to it -
# environment secrets shadow organization ones.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: should this tag publish the npm package?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.g.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to diff against the previous tag

      - id: g
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' js/package.json)
          [ -n "$VERSION" ] || { echo "no version in js/package.json" >&2; exit 1; }

          # The tag must name this artifact's version (set-version bumps it).
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "tag ${TAG} != @desert-ant-labs/core ${VERSION}; skipping (not this artifact's release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Every artifact in the repo ships one version, and the model packages
          # pin core exactly, so core has to exist at every released version.
          publish=true
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish @desert-ant-labs/core to npm
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      # Just the mise binary; the publish-npm task pulls Node on demand.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise run publish-npm
