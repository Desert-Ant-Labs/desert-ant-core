name: Build

# Verify desert-ant-core's three published artifacts actually build, and that
# every artifact in the repo still carries one version. The Swift package is
# covered per-platform by macos/ios/wasi/android.yml; these are the non-Swift
# artifacts, which previously only ever built during a publish - so a break in
# them stayed invisible until release time. Version drift had the same problem.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    name: one version everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      # Drift is only a release-time problem if nothing checks it before then.
      - run: mise run check-version

  kotlin:
    name: ai.desertant:core (Android AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run build-android

  js:
    name: "@desert-ant-labs/core (npm)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run test-js

  bundles:
    # The isomorphic npm packages break in bundlers, not in unit tests: every SSR
    # regression we shipped passed test-js and failed in a consumer's
    # `next build`. This packs the core and both model packages and builds them
    # with esbuild, vite, webpack, and Next (Turbopack + webpack).
    # See js/test/bundle/README.md. The wasm dist/ is stubbed here (no Swift
    # toolchain); each model SDK repo runs the same matrix against the real one.
    name: bundle matrix (browser / SSR / Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run test-bundles

  gradle-plugin:
    name: model-sdk Gradle plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise run build-plugin
