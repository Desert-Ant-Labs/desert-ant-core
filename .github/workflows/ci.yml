name: CI

# One workflow, one job per platform we ship, and every job is a `mise run` of
# the same task you run locally. The question it answers is the only one that
# matters here: does every model still work on every platform?
#
#   apple    Swift on macOS (Core ML) and on an iOS Simulator
#   darwin-native  the prebuilt native the npm package ships, on the release runner
#   linux    Swift on Linux (LiteRT)
#   js       wasm + native cores, then every npm package: Node, browser, SSR
#   android  the Swift JNI natives, both AARs, and the on-device suites
#   checks   version consistency and the core JS unit tests
#
# Adding a model adds no CI: every task discovers models from the filesystem.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (versions, JS units)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      # One version across the repo is only a property if something checks it
      # before release day.
      - run: mise run check:version
      - run: mise run check:manifest
      - run: mise run check:links
      - run: mise run check:docs
      # hub:sync rendered against docs/hub-cards/, an archive that no longer exists.
      # The dry run is the same check against what the Hub actually serves, and it
      # needs no token: every repo it reads is public.
      - run: mise run hub:publish --dry-run
      # The .d.ts files are the API every TypeScript consumer sees, and they are
      # hand-written. This job has no built core, so it checks that they compile;
      # the js job runs the same task after build:wasm, where it also proves the
      # declared wasm ABI is the one Swift exports.
      - run: mise run check:types
      # check:swift-floor links the dynamic products, so it vendors LiteRT, which
      # is fetched with uv exactly as the linux and js jobs do.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      # The README promises a minimum Swift; this builds on exactly that, because
      # the claim silently drifted twice while nothing checked it.
      - run: mise run check:swift-floor
      - run: mise run test:js

  apple:
    name: Apple (macOS + iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6
      - uses: jdx/mise-action@v4

      # No model artifact is committed, so the model-backed suites download the
      # pinned revision on a cold cache. Cache the store so that happens once
      # per revision rather than once per push, which also keeps the run
      # independent of Hugging Face being reachable. Each model's revision lives
      # in its Catalog.swift, so those files are the key.
      - name: Cache downloaded models
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/desert-ant-models
          key: models-${{ runner.os }}-${{ hashFiles('Sources/*/Catalog.swift') }}
          restore-keys: models-${{ runner.os }}-

      # test:ios pins DerivedData and the SPM clones to .build/ when $CI is set,
      # so this cache turns the simulator build into an incremental one.
      # Package.resolved keys the dependency graph; restore-keys accept a stale
      # cache, which xcodebuild then patches incrementally.
      #
      # (This used to say swift-syntax dominated the job, via JavaScriptKit's
      # macro plugin. That stopped being true when JavaScriptKit became opt-in
      # behind DAL_WASM_BUILD, which test:ios does not set: swift-syntax no
      # longer appears in the build log at all.)
      - name: Cache iOS DerivedData and SPM clones
        uses: actions/cache@v6
        with:
          path: |
            .build/ios-deriveddata
            .build/ios-packages
          key: ios-deriveddata-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ios-deriveddata-${{ runner.os }}-

      - run: mise run build:swift
      - run: mise run test:swift
      - run: mise run test:ios

  darwin-native:
    name: darwin native (npm)
    # The runner release.yml publishes the darwin-arm64 native from, so the
    # toolchain that ships is the one CI proves. It was macos-14 to keep the
    # shipped native on the oldest compiler, but macos-14 carries Swift 5.10 and
    # the package now requires 6.2, so it cannot build this at all.
    #
    # Nothing is lost by moving. The artifact's compatibility floor comes from the
    # manifest's `platforms`, not the runner: built here it still reports
    # `minos 13.0` (verified with otool), the same as before. And "does it build on
    # the oldest compiler we promise" is now a job of its own, check:swift-floor,
    # which is a stricter version of what the old runner pin was reaching for - a
    # broken release once shipped through exactly that gap. macOS still ships bash
    # 3.2, so this remains the task set's only cover for the empty-array expansion
    # the Linux jobs accept.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      # v7 is the newest floating major tag this action publishes (its later
      # releases ship no vN alias), and it already runs on node24.
      - uses: astral-sh/setup-uv@v7
        with:
          # uv only unpacks a wheel here; there is no uv.lock or
          # requirements.txt to key a cache on, and asking for one warns
          # that it can never be invalidated.
          enable-cache: false
      - run: mise run build:node-native

  linux:
    name: Linux (Swift + LiteRT)
    runs-on: ubuntu-22.04 # glibc 2.35; the *published* natives build on 2.34 in release.yml
    steps:
      - uses: actions/checkout@v5
      - name: Build deps (static Foundation autolinks these)
        run: |
          # These three are already on the ubuntu-22.04 runner image, so the
          # common path installs nothing and never touches the network. That
          # matters: apt has wedged on a bad mirror here, sitting on `update` until the
          # job's 6 h timeout rather than failing - one hung runner blocked two
          # PRs at once. Bound each attempt and retry, so a bad mirror costs
          # seconds and a retry instead of the run. Retrying rather than just
          # `timeout-minutes`: that would still lose the run to a manual re-run,
          # which is the toil this is here to remove.
          #
          # `sudo timeout`, not `timeout sudo`: the latter runs the killer as the
          # runner user, which cannot signal the root apt-get it is trying to
          # stop (EPERM), so the hang survives its own timeout. -k follows up
          # with SIGKILL for an apt wedged past SIGTERM.
          pkgs="libcurl4-openssl-dev libxml2-dev zlib1g-dev"
          missing=""
          for p in $pkgs; do
            dpkg -s "$p" > /dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "already on the runner image: $pkgs"
            exit 0
          fi
          echo "missing:$missing"
          for attempt in 1 2 3; do
            if sudo timeout -k 10 120 apt-get update -qq \
              && sudo timeout -k 10 180 apt-get install -y -qq --no-install-recommends $missing; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt timed out or failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::apt failed after 3 attempts"
          exit 1
      - uses: jdx/mise-action@v4
      # `mise run` vendors libLiteRt.so out of the ai-edge-litert wheel with uv.
      - uses: astral-sh/setup-uv@v7
        with:
          # uv only unpacks a wheel here; there is no uv.lock or
          # requirements.txt to key a cache on, and asking for one warns
          # that it can never be invalidated.
          enable-cache: false

      # Same reasoning as the Apple job: no model artifact is committed, so the
      # model-backed suites download the pinned revision on a cold cache. Cache
      # the store so that happens once per revision rather than once per push -
      # anonymous Hub tree calls from every push 429 under parallel jobs - and
      # the run stays independent of Hugging Face being reachable. On Linux the
      # managed store lives under XDG's ~/.cache.
      - name: Cache downloaded models
        uses: actions/cache@v6
        with:
          path: ~/.cache/desert-ant-models
          key: models-${{ runner.os }}-${{ hashFiles('Sources/*/Catalog.swift') }}
          restore-keys: models-${{ runner.os }}-

      # An app that adds one SDK must pay for that SDK alone; this reads the
      # resolved SwiftPM graph, so it needs the toolchain this job already has.
      - run: mise run check:isolation
      - run: mise run build:swift
      - run: mise run test:swift

  js:
    name: JavaScript (wasm, Node native, browser/SSR bundles)
    # glibc 2.35, matching the floor the published Linux natives target.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build deps (static Foundation autolinks these)
        run: |
          # These three are already on the ubuntu-22.04 runner image, so the
          # common path installs nothing and never touches the network. That
          # matters: apt has wedged on a bad mirror here, sitting on `update` until the
          # job's 6 h timeout rather than failing - one hung runner blocked two
          # PRs at once. Bound each attempt and retry, so a bad mirror costs
          # seconds and a retry instead of the run. Retrying rather than just
          # `timeout-minutes`: that would still lose the run to a manual re-run,
          # which is the toil this is here to remove.
          #
          # `sudo timeout`, not `timeout sudo`: the latter runs the killer as the
          # runner user, which cannot signal the root apt-get it is trying to
          # stop (EPERM), so the hang survives its own timeout. -k follows up
          # with SIGKILL for an apt wedged past SIGTERM.
          pkgs="libcurl4-openssl-dev libxml2-dev zlib1g-dev"
          missing=""
          for p in $pkgs; do
            dpkg -s "$p" > /dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "already on the runner image: $pkgs"
            exit 0
          fi
          echo "missing:$missing"
          for attempt in 1 2 3; do
            if sudo timeout -k 10 120 apt-get update -qq \
              && sudo timeout -k 10 180 apt-get install -y -qq --no-install-recommends $missing; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt timed out or failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::apt failed after 3 attempts"
          exit 1
      - uses: jdx/mise-action@v4
      - uses: astral-sh/setup-uv@v7
        with:
          # uv only unpacks a wheel here; there is no uv.lock or
          # requirements.txt to key a cache on, and asking for one warns
          # that it can never be invalidated.
          enable-cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
          key: swift-wasm-sdk-6.3.3

      # The three Swift builds this job runs from scratch otherwise: the wasm
      # test build (test:wasi) and the wasm release builds (build:wasm) share
      # the default .build - which also holds the swift-syntax macro host build
      # JavaScriptKit's BridgeJS plugin needs, minutes on its own - and
      # build:node-native uses .build-host. The source hash keys an exact hit;
      # restore-keys accept a stale cache SwiftPM then patches incrementally.
      - name: Cache the Swift builds (wasm + native)
        uses: actions/cache@v6
        with:
          path: |
            .build
            .build-host
          key: js-swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**') }}
          restore-keys: js-swift-build-${{ runner.os }}-

      # test:browser fetches Chromium (~130 MB) through Playwright on every
      # cold run; the lockfile pins the Playwright version, which decides the
      # browser build it wants.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # npm ci runs several times (workspace install, test:bundles' packed
      # installs); a warm ~/.npm turns those into cache reads.
      - name: Cache the npm store
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # The node package suites download the pinned model revision too: into the
      # suite-local .model-cache (an explicit `directory`), and the managed store
      # for anything resolving by default. Cache both for the same reason as the
      # Swift jobs. The browser suite fetches inside Chromium and is not covered
      # by a file cache.
      - name: Cache downloaded models
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/desert-ant-models
            packages/*-node/test/.model-cache
          key: models-js-${{ runner.os }}-${{ hashFiles('Sources/*/Catalog.swift') }}
          restore-keys: models-js-${{ runner.os }}-

      # The JS-host backends (JSON.parse, RegExp, String.normalize, fetch) only
      # actually execute under wasm, so this is the browser correctness check.
      - run: mise run test:wasi

      # Both halves of every npm package: the browser wasm core and the
      # server-side native core. The package suites need both - they assert the
      # native path does inference and the default (browser) entry still imports
      # cleanly in Node, which is the SSR contract.
      - run: mise run build:wasm

      # check:types runs in the checks job too, but only this job has a built
      # core, which is what makes the same task prove WasmCore in js/index.d.ts is
      # identical to the ABI BridgeJS generated from the Swift @JS declarations,
      # and that no package's dist is stale.
      - run: mise run check:types

      # These natives only feed test:node and are never published; the real
      # distribution floor (glibc 2.34, AWS Lambda's AL2023) is enforced by the
      # release workflow, which builds inside a glibc-2.34 container. This host
      # is newer, so state its own floor instead of tripping the guard.
      - run: mise run build:node-native
        env:
          DAL_GLIBC_CEILING: "2.35"
      - run: mise run test:node

      # A container with /sys/devices/system/cpu masked, the shape Lambda
      # presents: the read must fail without the preload and succeed with it.
      # x86_64 gates it because the interposition is arch-independent.
      - name: cpu-topology shim intercepts a masked sysfs
        run: |
          set -euo pipefail
          shim=packages/redact-node/native/linux-x64/libdalcpushim.so
          [ -f "$shim" ] || { echo "::error::build:node-native did not produce $shim"; exit 1; }
          mask="--mount type=tmpfs,destination=/sys/devices/system/cpu,tmpfs-mode=0555"
          read_cpu='require("node:fs").readFileSync("/sys/devices/system/cpu/possible","utf8")'
          if docker run --rm $mask -v "$PWD/$shim:/shim.so" node:22-slim \
               node -e "$read_cpu" 2>/dev/null; then
            echo "::error::sysfs was readable without the shim; the test proves nothing"
            exit 1
          fi
          got=$(docker run --rm $mask -v "$PWD/$shim:/shim.so" -e LD_PRELOAD=/shim.so \
                  node:22-slim node -e "process.stdout.write($read_cpu.trim())")
          echo "with shim, /sys/devices/system/cpu/possible = '$got'"
          [[ "$got" =~ ^0(-[0-9]+)?$ ]] || { echo "::error::unexpected cpu range '$got'"; exit 1; }

      # The browser is the default entry of every model package, so it gets a
      # real engine and real weights, not just a bundle that compiles.
      - run: mise run test:browser

      # Then the packages through the real bundlers, against the real dist.
      # Every SSR break we ever shipped passed the unit tests and failed in a
      # consumer's `next build`.
      - run: mise run test:bundles

  windows:
    # Experimental: Redact is the first (and so far only) model built natively
    # on Windows -- same LiteRT lane as Linux, with the runtime vendored from
    # the win_amd64 ai-edge-litert wheel. Build-only for now: `swift test`
    # would compile every test target, and the rest of the package is not yet
    # Windows-guarded, so the gate is Redact plus its own test target compiling
    # against their exact dependency closures.
    name: Windows (Swift, Redact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@v3
        with:
          branch: swift-6.2.1-release
          tag: 6.2.1-RELEASE
      # dumpbin/lib for the import-library step in vendor-litert.ps1.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Vendor LiteRT (win_amd64 wheel)
        shell: pwsh
        run: Tools/windows/vendor-litert.ps1
      - name: Build Redact
        shell: pwsh
        run: swift build --target Redact -Xlinker /LIBPATH:Vendor/litert/lib/windows-x64
      - name: Build RedactTests
        shell: pwsh
        run: swift build --target RedactTests -Xlinker /LIBPATH:Vendor/litert/lib/windows-x64

  android:
    name: Android (natives, AARs, on-device)
    # ubuntu-22.04 is the proven-stable runner for android-emulator-runner; the
    # emulator has been flaky on 24.04. build:android-natives fetches the Swift
    # snapshot tarball built for this Ubuntu release, so the cross-compile and
    # the emulator can share one job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # The emulator needs ~7.4 GB for userdata, and the Swift Android SDK, NDK,
      # and snapshot toolchain land on top of that. Drop toolchains we never use
      # (keep the Android SDK).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Swift toolchain system deps
        run: |
          # These three are already on the ubuntu-22.04 runner image, so the
          # common path installs nothing and never touches the network. That
          # matters: apt has wedged on a bad mirror here, sitting on `update` until the
          # job's 6 h timeout rather than failing - one hung runner blocked two
          # PRs at once. Bound each attempt and retry, so a bad mirror costs
          # seconds and a retry instead of the run. Retrying rather than just
          # `timeout-minutes`: that would still lose the run to a manual re-run,
          # which is the toil this is here to remove.
          #
          # `sudo timeout`, not `timeout sudo`: the latter runs the killer as the
          # runner user, which cannot signal the root apt-get it is trying to
          # stop (EPERM), so the hang survives its own timeout. -k follows up
          # with SIGKILL for an apt wedged past SIGTERM.
          pkgs="libcurl4-openssl-dev libxml2-dev zlib1g-dev"
          missing=""
          for p in $pkgs; do
            dpkg -s "$p" > /dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "already on the runner image: $pkgs"
            exit 0
          fi
          echo "missing:$missing"
          for attempt in 1 2 3; do
            if sudo timeout -k 10 120 apt-get update -qq \
              && sudo timeout -k 10 180 apt-get install -y -qq --no-install-recommends $missing; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt timed out or failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: jdx/mise-action@v4

      # The snapshot toolchain (~1.2 GB), the Android SDK bundles (~330 MB), and
      # the NDK install on demand; cache them so only the first run pays.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/desert-ant/toolchains
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
            Vendor/litert
          key: swift-android-6.4.x-2026-07-17-a-ubuntu-22.04-api24-litert-2.1.6

      # Gradle caches (wrapper, dependencies, configuration cache) survive runs.
      - uses: gradle/actions/setup-gradle@v4

      # The Swift cross-compile scratch dirs. Restoring them turns the
      # static-stdlib release builds into incremental ones; the source hash
      # keys an exact hit, and restore-keys accept a stale cache that SwiftPM
      # then patches incrementally. Two dirs, one per toolchain: .build-android
      # belongs to the 6.4.x snapshot (build:android-natives), .build-androidtest
      # to the pinned release toolchain (test:android). Sharing one dir poisoned
      # the restored state across toolchains (CHostBridge: stdlib.h not found).
      - name: Cache the Android Swift builds
        uses: actions/cache@v6
        with:
          path: |
            .build-android
            .build-androidtest
          key: android-swift-build-v2-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**') }}
          restore-keys: android-swift-build-v2-

      # Cross-compile and package first, outside the emulator's lifetime, so a
      # long native build does not eat the emulator boot timeout. The emulator
      # is x86_64, so skip the arm64 cross-compiles CI would never run - that
      # is half of the Swift build work. The release workflow builds both.
      - run: mise run build:android
        env:
          DAL_ANDROID_ABIS: x86_64

      # Stage the JNI test harness now too, for the same reason.
      - run: mise run test:android --stage-only
        env:
          DAL_ANDROID_ABIS: x86_64

      # A cold boot costs minutes; cache a booted-once AVD snapshot and resume
      # from it on every later run.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-x86_64-default

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31 # androidtest minSdk (ICU NFKC needs 31+)
          arch: x86_64
          target: default # AOSP image: smaller and faster than google_apis, nothing here needs Play Services
          force-avd-creation: false
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "Generated AVD snapshot for caching"

      - name: On-device tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # If Gradle's preBuild re-runs build:android-natives, keep it on the
          # one ABI this emulator can execute.
          DAL_ANDROID_ABIS: x86_64
        with:
          api-level: 31 # androidtest minSdk (ICU NFKC needs 31+)
          arch: x86_64
          target: default
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: mise run test:android --no-stage
