name: Sync from manifest

# Pushes the model table and cards to every surface that publishes them:
# Hugging Face model cards, the Hugging Face org card, and the GitHub org profile.
# The only workflow in this repo that writes outside it, so it is deliberately
# narrow: it runs on a manual dispatch, or on a push to main that actually
# touched the registry or the renderer.
#
# Needs HF_TOKEN, a write token on the desert-ant-labs org, and
# ORG_PROFILE_TOKEN, which needs contents:write on Desert-Ant-Labs/.github
# (the workflow's own GITHUB_TOKEN cannot reach another repository).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change and upload nothing"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - manifest.json
      - Tools/manifest-docs.mjs
      - mise-tasks/hub/**
      - mise-tasks/github/**
      - .github/workflows/hub-sync.yml

# One writer at a time: two merges landing together must not race the Hub.
concurrency:
  group: hub-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      # The cards are only as good as the registry they come from.
      - run: mise run check:manifest
      - run: mise run check:links
      # Without the secret this previews rather than failing, so merging to main
      # before the token exists leaves main green instead of red.
      - name: Publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ] || [ -z "$HF_TOKEN" ]; then
              flag="--dry-run"
              [ -n "$HF_TOKEN" ] || echo "::warning::HF_TOKEN is not set, so the Hub was NOT updated."
          fi
          mise run hub:publish $flag

      - name: Publish the GitHub org profile
        env:
          ORG_PROFILE_TOKEN: ${{ secrets.ORG_PROFILE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ] || [ -z "$ORG_PROFILE_TOKEN" ]; then
              flag="--dry-run"
              [ -n "$ORG_PROFILE_TOKEN" ] || echo "::warning::ORG_PROFILE_TOKEN is not set, so the GitHub org profile was NOT updated."
          fi
          mise run github:profile $flag
