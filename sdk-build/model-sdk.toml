# Shared build/test/publish task catalog for Desert Ant Labs model SDKs.
#
# A model repo (shapes, emo, redact, ...) includes this from a pinned tag:
#
#   [tools]
#   swift = "6.3.3"
#
#   [vars]
#   model        = "emo"        # lowercase: paths + npm/Maven/HF/GitHub coordinates
#   product      = "Emo"        # capitalized: Swift products, lib names
#
# No SDK ships a model artifact: every platform downloads the revision pinned in
# the core model catalog on first use, so there is nothing to stage or publish.
#
#   [env]
#   DAL_GPU = ""                # non-empty ships Linux LiteRT GPU siblings
#
#   [task_config]
#   includes = ["git::https://github.com/Desert-Ant-Labs/desert-ant-core.git//sdk-build/model-sdk.toml?ref=v0.4.0"]
#
# `[vars]` names the model in a single-model repo; the monorepo has several, so
# the tasks fall back to `DAL_MODEL` / `DAL_PRODUCT`. `[vars]` still wins.
#
# The tasks derive every model-specific name from `model`/`product`. Test tasks
# (test, test-node, test-web, test-android-firebase) stay in the model repo,
# since their harnesses differ; this catalog owns the identical build, publish,
# version, and the two invariant test entry points (test-swift, test-android).
#
# The release version is single-sourced from packages/<model>-node/package.json;
# the two Gradle module versions must match it (the publish tasks verify).

# ---------------------------------------------------------------- build

["build"]
description = "Build every artifact (swift + android + web + node native)"
depends = ["build-swift", "build-android", "build-web", "node-natives"]

["litert-libs"]
hide = true
dir = "{{ config_root }}"
shell = "bash -c"
usage = '''
flag "--gpu" help="Also vendor the LiteRT GPU accelerator sibling (for GPU models)"
flag "--litert-version <ver>" help="LiteRT (ai-edge-litert) version to vendor" default="2.1.6"
'''
run = """
set -euo pipefail
LITERT_VER="${usage_litert_version:-2.1.6}"
LITERT_GPU="${DAL_GPU:-${usage_gpu:-}}"   # non-empty (--gpu or [env] DAL_GPU) also ships the accelerator sibling
# Apple hosts need no LiteRT: the Swift SDK uses Core ML, and so does the
# server-side Node native (it loads the bundled .mlmodelc by path). Linux links
# the vendored libLiteRt.
if [ "$(uname)" = "Darwin" ]; then exit 0; fi
# Match the vendored lib to the host arch (linux-x64 or linux-arm64).
case "$(uname -m)" in
  x86_64|amd64) LARCH=linux-x64; WHEEL_PLAT=x86_64-manylinux_2_28;;
  aarch64|arm64) LARCH=linux-arm64; WHEEL_PLAT=aarch64-manylinux_2_28;;
  *) echo "error: unsupported arch $(uname -m)" >&2; exit 1;;
esac
dest="Vendor/litert/lib/$LARCH"
if [ -f "$dest/libLiteRt.so" ]; then exit 0; fi
mkdir -p "$dest"
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
echo "Fetching ai-edge-litert $LITERT_VER ($LARCH libLiteRt.so, one-time)..."
# uv resolves the matching Linux wheel for the target platform (no host Python
# needed) and unpacks it into a throwaway target dir; the runtime .so ships at
# ai_edge_litert/libLiteRt.so.
uv pip install --python-platform "$WHEEL_PLAT" --python-version 3.12 \\
    --target "$tmp/site" --only-binary=:all: "ai-edge-litert==$LITERT_VER" >/dev/null
[ -f "$tmp/site/ai_edge_litert/libLiteRt.so" ] || { echo "error: libLiteRt.so not in ai-edge-litert wheel" >&2; exit 1; }
cp "$tmp/site/ai_edge_litert/libLiteRt.so" "$dest/"
# GPU models also ship the WebGPU accelerator sibling, which core's LiteRTSession
# (.auto default) then uses automatically. CPU models ship libLiteRt.so only.
if [ -n "$LITERT_GPU" ] && [ -f "$tmp/site/ai_edge_litert/libLiteRtWebGpuAccelerator.so" ]; then
    cp "$tmp/site/ai_edge_litert/libLiteRtWebGpuAccelerator.so" "$dest/"
fi
ls -la "$dest"
"""

["build-swift"]
description = "SwiftPM build (Core ML on Apple hosts, LiteRT on Linux)"
dir = "{{ config_root }}"
shell = "bash -c"
depends = ["litert-libs"]
run = """
set -euo pipefail
# Just this model's target: the monorepo holds several, and building one SDK
# should not compile the others. `--target`, not `--product`: the model
# libraries are automatic products, which SwiftPM refuses to select and then
# silently builds everything instead.
TARGET={{ vars.product | default(value=env.DAL_PRODUCT) }}
# On Apple, Core ML is part of the OS. Linux links the vendored LiteRT runtime.
if [ "$(uname)" = "Darwin" ]; then
    swift build --target "$TARGET"
else
    swift build --target "$TARGET" -Xlinker -LVendor/litert/lib/linux-x64
fi
"""

["build-android"]
description = "Build the Android AAR (drives android-natives, then Gradle)"
dir = "{{ config_root }}"
tools = { java = "temurin-21" }
shell = "bash -c"
run = """
set -euo pipefail
module=packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin
./gradlew -p "$module" assembleRelease
aar=$(find "$module/build/outputs/aar" -name '*-release.aar' | head -1)
[ -n "$aar" ] || { echo "error: release AAR not found" >&2; exit 1; }
! unzip -Z1 "$aar" | grep -Eq 'libLiteRt|libc\\+\\+_shared'
for abi in arm64-v8a x86_64; do
    unzip -Z1 "$aar" | grep -qx "jni/$abi/lib{{ vars.product | default(value=env.DAL_PRODUCT) }}Android.so"
done
"""

["build-web"]
description = "Build the WebAssembly core into packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/dist"
dir = "{{ config_root }}"
shell = "bash -c"
tools = { "aqua:WebAssembly/binaryen" = "130" }  # wasm-opt
run = """
set -euo pipefail

# The Swift SDK for WebAssembly installs on demand (matched to the toolchain
# version). wasm-opt (binaryen) comes from mise [tools]; the check below still
# degrades gracefully if it is somehow absent (ships ~3x larger).
OUT=.build/wasm-package
DIST=packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/dist

# Match the SDK to the installed toolchain version. Download and install from the
# local file (no --checksum needed that way), so any Swift version just works.
SWIFT_VER=$(swift --version 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^[0-9]/){print $i; exit}}')
[ -n "$SWIFT_VER" ] || { echo "error: could not determine the Swift version" >&2; exit 1; }
SDK=${WASM_SDK:-swift-$SWIFT_VER-RELEASE_wasm}

# Adds JavaScriptKit to the desert-ant-core manifest (SwiftPM re-evaluates it in
# this process env). It is opt-in so non-wasm consumers never resolve it.
export DAL_WASM_BUILD=1

have_bundle() { for d in "$HOME/.swiftpm/swift-sdks" "$HOME/.config/swiftpm/swift-sdks" "$HOME/Library/org.swift.swiftpm/swift-sdks"; do [ -d "$d/$1" ] && return 0; done; return 1; }
if ! have_bundle "$SDK.artifactbundle"; then
    echo "Installing the Swift WebAssembly SDK $SWIFT_VER (one-time)..."
    tmp=$(mktemp -d)
    curl -fSL -o "$tmp/sdk.tar.gz" "https://download.swift.org/swift-$SWIFT_VER-release/wasm-sdk/swift-$SWIFT_VER-RELEASE/$SDK.artifactbundle.tar.gz"
    swift sdk install "$tmp/sdk.tar.gz"
    rm -rf "$tmp"
fi

# --allow-writing-to-package-directory: the js packaging plugin writes $OUT under
# .build/, which SwiftPM's plugin sandbox blocks on macOS without this.
swift package -Xswiftc -Osize --swift-sdk "$SDK" --allow-writing-to-package-directory js --product {{ vars.product | default(value=env.DAL_PRODUCT) }}Web -c release --output "$OUT"

if command -v wasm-opt >/dev/null; then
    wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --strip-debug --strip-producers "$OUT/{{ vars.product | default(value=env.DAL_PRODUCT) }}Web.wasm" -o "$OUT/{{ vars.product | default(value=env.DAL_PRODUCT) }}Web.wasm"
else
    echo "warning: wasm-opt not found; shipping unoptimized wasm (~3x larger)" >&2
fi

rm -rf "$DIST"
mkdir -p "$DIST"
cp "$OUT"/{{ vars.product | default(value=env.DAL_PRODUCT) }}Web.wasm "$OUT"/index.js "$OUT"/index.d.ts "$OUT"/instantiate.js "$OUT"/instantiate.d.ts "$OUT"/runtime.js "$OUT"/runtime.d.ts "$DIST/"
cp -r "$OUT"/platforms "$DIST/platforms"
# The npm tarball must carry the license (package.json: SEE LICENSE IN LICENSE.md).
cp LICENSE.md packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/LICENSE.md

ls -la "$DIST/{{ vars.product | default(value=env.DAL_PRODUCT) }}Web.wasm"
echo "done: packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node is ready (npm pack in that directory to check the tarball)"
"""

["node-natives"]
description = "Build the native server-side Node core into packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/native/<platform>-<arch> (run per OS)"
dir = "{{ config_root }}"
shell = "bash -c"
depends = ["litert-libs"]
run = """
set -euo pipefail
# The Node package is isomorphic: browsers get the WebAssembly + LiteRT.js build,
# Node gets this prebuilt native core (the {{ vars.product | default(value=env.DAL_PRODUCT) }}Node product = the C ABI in
# CABI.swift; AndroidJNI.swift is #if os(Android), so a host build is just the
# ABI). koffi in packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node binds {{ vars.model | default(value=env.DAL_MODEL) }}_* over it. Cross-OS builds
# aren't possible, so run this on each target OS; publish gathers them.
#
# Backend per OS matches the rest of the SDK: Linux uses LiteRT (.tflite, links
# the vendored libLiteRt.so, static Swift+Foundation so the .so is
# self-contained); macOS uses Core ML (.mlmodelc) against the OS-provided Swift
# runtime and system frameworks (nothing extra to ship).
#
# Two Linux distribution rules (learned the hard way): build on an OLD glibc base
# (the published libs are built in a swift:6.3.2-jammy container = glibc 2.35, so
# they run on Ubuntu 22.04+/Debian 12+, not just the build host), and link
# `-z nodelete` so the process doesn't dlclose the static Swift runtime at
# shutdown (which otherwise segfaults on natural exit on some glibc versions).
# --disable-default-traits is rejected by SwiftPM on a package that declares no
# traits, so only pass it when the manifest actually has some. Models small
# enough to bundle declare a BundledModel trait (disabled here, since the npm
# package ships no SwiftPM resource bundle); larger models declare none.
TRAITS=""
grep -q "traits:" Package.swift && TRAITS="--disable-default-traits"
ARCH=$(uname -m); case "$ARCH" in x86_64|amd64) NARCH=x64;; arm64|aarch64) NARCH=arm64;; *) NARCH=$ARCH;; esac
if [ "$(uname)" = "Darwin" ]; then
    # macOS: the Node native uses Core ML (against the OS-provided Swift runtime
    # and system frameworks) and loads the bundled .mlmodelc by path - so it
    # needs no LiteRT and ships no extra runtime.
    KEY="darwin-$NARCH"; dest="packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/native/$KEY"; rm -rf "$dest" && mkdir -p "$dest"
    swift build -c release --product {{ vars.product | default(value=env.DAL_PRODUCT) }}Node $TRAITS -Xlinker -rpath -Xlinker @loader_path
    cp ".build/release/lib{{ vars.product | default(value=env.DAL_PRODUCT) }}Node.dylib" "$dest/"
else
    KEY="linux-$NARCH"; dest="packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/native/$KEY"; rm -rf "$dest" && mkdir -p "$dest"
    # Static Foundation on Linux autolinks -lcurl/-lxml2/-lz; provide dev-name
    # symlinks to the runtime sonames (the recorded DT_NEEDED stays the soname,
    # which is present on any normal Linux).
    tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
    ldc=$(command -v ldconfig || echo /sbin/ldconfig)
    for so in libcurl.so.4 libxml2.so.2 libz.so.1; do
        src=$("$ldc" -p 2>/dev/null | awk -v n="$so" '$1==n{print $NF; exit}' || true)
        [ -n "$src" ] && ln -sf "$src" "$tmp/$(echo "$so" | sed 's/\\.so.*/.so/')" || true
    done
    LARCH=$([ "$NARCH" = "x64" ] && echo linux-x64 || echo linux-arm64)
    swift build -c release --product {{ vars.product | default(value=env.DAL_PRODUCT) }}Node $TRAITS -Xswiftc -static-stdlib \\
        -Xlinker "-L$tmp" -Xlinker "-LVendor/litert/lib/$LARCH" -Xlinker -rpath -Xlinker '$ORIGIN' \\
        -Xlinker -z -Xlinker nodelete
    cp ".build/release/lib{{ vars.product | default(value=env.DAL_PRODUCT) }}Node.so" "$dest/"
    cp "Vendor/litert/lib/$LARCH/libLiteRt.so" "$dest/"
fi
ls -la "$dest"
echo "done: packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/native/$KEY ready"
"""

# ---------------------------------------------------------------- test

["test-swift"]
description = "SwiftPM test suite (Core ML on macOS, LiteRT on Linux)"
dir = "{{ config_root }}"
shell = "bash -c"
depends = ["litert-libs"]
run = """
set -euo pipefail
# On Apple, Core ML is part of the OS. Linux links and loads the vendored LiteRT runtime.
if [ "$(uname)" = "Darwin" ]; then
    swift test
else
    LD_LIBRARY_PATH=Vendor/litert/lib/linux-x64 swift test -Xlinker -LVendor/litert/lib/linux-x64
fi
"""

["test-android"]
description = "Instrumented AAR test suite on a connected device/emulator"
dir = "{{ config_root }}"
tools = { java = "temurin-21" }
run = "./gradlew -p packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin connectedDebugAndroidTest"

# ---------------------------------------------------------------- publish

["set-version"]
description = "Set the release version everywhere (package.json, Gradle modules, README)"
dir = "{{ config_root }}"
tools = { node = "22" }
shell = "bash -c"
usage = '''
arg "<version>" help="Release version (X.Y.Z)"
'''
run = """
set -euo pipefail
VERSION="${usage_version:?version arg required}"
echo "$VERSION" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+$' || { echo "error: version must be X.Y.Z, got '$VERSION'" >&2; exit 1; }

# npm keeps package.json and package-lock.json in sync.
( cd packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node && npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null )

# The Gradle module (project version drives the Maven coordinates).
kts=packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin/build.gradle.kts
sed -i.bak 's/^version = ".*"$/version = "'"$VERSION"'"/' "$kts" && rm -f "$kts.bak"

# The SwiftPM install snippet in the README.
sed -i.bak 's|\\(url: "https://github.com/Desert-Ant-Labs/{{ vars.model | default(value=env.DAL_MODEL) }}.git", from: "\\)[^"]*"|\\1'"$VERSION"'"|' README.md && rm -f README.md.bak

mise run check-version >/dev/null
echo "version set to $VERSION (package.json + lock, Gradle module, README)"
"""

# Verifies the release version is consistent everywhere before any publish:
# packages/<model>-node/package.json is the single source; the Gradle module
# version must equal it. Prints the version.
["check-version"]
hide = true
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
npm_version=$(sed -n 's/^  "version": "\\([^"]*\\)",$/\\1/p' packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/package.json)
[ -n "$npm_version" ] || { echo "error: no version in packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/package.json" >&2; exit 1; }
f=packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin/build.gradle.kts
gradle_version=$(sed -n 's/^version = "\\(.*\\)"$/\\1/p' "$f")
[ "$gradle_version" = "$npm_version" ] || { echo "error: $f has version $gradle_version, package.json has $npm_version" >&2; exit 1; }
echo "$npm_version"
"""

["publish-swift"]
description = "Release the Swift package: tag vX.Y.Z on origin/main and create the GitHub release"
dir = "{{ config_root }}"
depends = ["check-version"]
shell = "bash -c"
run = """
set -euo pipefail
# SwiftPM releases are semver tags on the repo; consumers pin
# .package(url: ..., from: "X.Y.Z"). Tag the pushed main, not local state, then
# create the GitHub Release object so the release is visible on github.com.
VERSION=$(sed -n 's/^  "version": "\\([^"]*\\)",$/\\1/p' packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node/package.json)
TAG="v$VERSION"
REPO="Desert-Ant-Labs/{{ vars.model | default(value=env.DAL_MODEL) }}"

jj git fetch
COMMIT=$(jj log -r main@origin --no-graph -T commit_id)
[ -n "$COMMIT" ] || { echo "error: no main@origin bookmark" >&2; exit 1; }

# Local tag may already exist from an interrupted or repeated release. It is ok
# only if it already points at the commit we are publishing.
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
    existing=$(git rev-parse "refs/tags/$TAG^{commit}")
    [ "$existing" = "$COMMIT" ] || {
        echo "error: local tag $TAG points at $existing, expected $COMMIT" >&2
        exit 1
    }
else
    git tag "$TAG" "$COMMIT"
fi

# Remote tag may also already exist. Verify it rather than force-pushing.
remote=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
if [ -n "$remote" ]; then
    [ "$remote" = "$COMMIT" ] || {
        echo "error: remote tag $TAG points at $remote, expected $COMMIT" >&2
        exit 1
    }
    echo "tag exists: $TAG -> $COMMIT"
else
    git push origin "$TAG"
    echo "pushed tag: $TAG -> $COMMIT"
fi

notes=$(mktemp)
trap 'rm -f "$notes"' EXIT
cat > "$notes" <<EOF
{{ vars.product | default(value=env.DAL_PRODUCT) }} $VERSION release.

## Packages

- SwiftPM: https://github.com/Desert-Ant-Labs/{{ vars.model | default(value=env.DAL_MODEL) }}.git, from $VERSION
- Android: ai.desertant:{{ vars.model | default(value=env.DAL_MODEL) }}:$VERSION
- npm: @desert-ant-labs/{{ vars.model | default(value=env.DAL_MODEL) }}@$VERSION
EOF

if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
    echo "release exists: https://github.com/$REPO/releases/tag/$TAG"
else
    gh release create "$TAG" --repo "$REPO" --title "{{ vars.product | default(value=env.DAL_PRODUCT) }} $VERSION" --notes-file "$notes"
fi

echo "published: Swift package release $TAG -> $COMMIT"
"""

["publish-android"]
description = "Publish ai.desertant:{{ vars.model | default(value=env.DAL_MODEL) }} to Maven Central"
dir = "{{ config_root }}"
depends = ["check-version"]
tools = { java = "temurin-21" }
shell = "bash -c"
run = """
set -euo pipefail
# Credentials come from mise.local.toml: a Central portal token and an in-memory
# signing key, passed as Gradle properties via the env:
#   ORG_GRADLE_PROJECT_mavenCentralUsername / ORG_GRADLE_PROJECT_mavenCentralPassword
#   ORG_GRADLE_PROJECT_signingInMemoryKey / ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
: "${ORG_GRADLE_PROJECT_mavenCentralUsername:?set the Central portal token in mise.local.toml}"
: "${ORG_GRADLE_PROJECT_signingInMemoryKey:?set the in-memory GPG signing key in mise.local.toml}"
./gradlew -p packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin publishAndReleaseToMavenCentral --no-configuration-cache
"""

["publish-web"]
description = "Publish @desert-ant-labs/{{ vars.model | default(value=env.DAL_MODEL) }} to npm"
dir = "{{ config_root }}/packages/{{ vars.model | default(value=env.DAL_MODEL) }}-node"
depends = ["check-version", "build-web"]
tools = { node = "22" }
shell = "bash -c"
run = """
set -euo pipefail
# Auth: NPM_TOKEN from mise.local.toml, or `npm login`.
# The token goes through a throwaway userconfig so normal npm commands and
# checked-in files never carry auth.
if [ -n "${NPM_TOKEN:-}" ]; then
    npmrc=$(mktemp)
    trap 'rm -f "$npmrc"' EXIT
    echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$npmrc"
    npm publish --access public --userconfig "$npmrc"
else
    npm publish --access public
fi
"""

# ---------------------------------------------------------------- internal

["android-natives"]
description = "Cross-compile the Android native libs into packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin/src/main/jniLibs (invoked by the Gradle build)"
dir = "{{ config_root }}"
shell = "bash -c"
usage = '''
flag "--litert-version <ver>" help="LiteRT android AAR version to link" default="2.1.6"
flag "--android-api <api>" help="Android minSdk/API level to build against" default="24"
'''
run = """
set -euo pipefail

# Uses a static Swift stdlib (-static-stdlib), so the whole Swift runtime is
# linked into a dead-stripped model-specific library instead of shipping the
# ~10 MB dynamic runtime closure. The NDK C++ runtime is linked statically too.
# ai.desertant:core owns LiteRT, so this AAR carries one model library per ABI.
#
# SWIFT_ANDROID_STATIC_BUILD drops JavaScriptKit from the manifest: its
# swift-syntax macros build for the host and conflict with the -resource-dir
# that static linking needs. The wasm/JS code is all #if os(WASI), so it is
# absent from an Android build anyway.
#
# The litert-android AAR's per-ABI libLiteRt.so must be under
# Vendor/litert/lib/android-<arch>/. The Swift Android SDK and the NDK it depends
# on (r27d+) install on demand below.
API="${usage_android_api:-24}"
KOTLIN=packages/{{ vars.model | default(value=env.DAL_MODEL) }}-kotlin/src/main
NDK_VER=r27d
export SWIFT_ANDROID_STATIC_BUILD=1

# Build against the OFFICIAL Swift Android SDK. The stable release bundles floor
# at API 28 (Bionic gained posix_spawn there), but the 6.4.x snapshots support
# API 23+, so this keeps minSdk 24 with first-party tooling. The SDK and the host
# toolchain must be the SAME snapshot - a mismatch is what produced the old
# "missing required module 'SwiftAndroid'" failures. Override the trio to move to
# a newer snapshot, or to a stable release once one ships API 24.
SNAP="${DAL_SWIFT_ANDROID_SNAPSHOT:-swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-17-a}"
SNAP_BRANCH="${DAL_SWIFT_ANDROID_BRANCH:-swift-6.4.x-branch}"
SDK_SUM="${DAL_SWIFT_ANDROID_SDK_CHECKSUM:-54a9c6b9491ea531cd3f5696f1071c2ca055cad89b89a2f408633b73f373c601}"
SDK_URL="https://download.swift.org/$SNAP_BRANCH/android-sdk/$SNAP/${SNAP}_android.artifactbundle.tar.gz"

# Host toolchain matching the SDK. On Linux we fetch the tarball into a cache dir
# (no swiftly: it has no packages for every distro, and CI needs no shell setup).
# On macOS the snapshot ships as a .pkg, so use swiftly there.
if [ "$(uname)" = "Darwin" ]; then
    command -v swiftly >/dev/null 2>&1 || { echo "error: swiftly is required on macOS to install the $SNAP toolchain" >&2; exit 1; }
    swiftly list 2>/dev/null | grep -q "$SNAP" || { echo "Installing $SNAP (one-time)..."; swiftly install "$SNAP"; }
    SWIFT() { swiftly run "$@" +"$SNAP"; }
else
    TC_ROOT="${DAL_SWIFT_TOOLCHAIN_DIR:-$HOME/.cache/desert-ant/toolchains}/$SNAP"
    if [ ! -x "$TC_ROOT/usr/bin/swift" ]; then
        echo "Installing the $SNAP host toolchain (one-time, ~1.2GB)..."
        mkdir -p "$TC_ROOT"
        curl -fSL "https://download.swift.org/$SNAP_BRANCH/ubuntu2404/$SNAP/$SNAP-ubuntu24.04.tar.gz" \
            | tar -xz -C "$TC_ROOT" --strip-components=1
    fi
    [ -x "$TC_ROOT/usr/bin/swift" ] || { echo "error: $SNAP toolchain not usable at $TC_ROOT" >&2; exit 1; }
    SWIFT() { "$TC_ROOT/usr/bin/$@"; }
fi

# Install the Android SDK bundle with that toolchain (idempotent: skip if present).
find_bundle() { for d in "$HOME/.swiftpm/swift-sdks" "$HOME/.config/swiftpm/swift-sdks" "$HOME/Library/org.swift.swiftpm/swift-sdks"; do b=$(ls -dt "$d"/*"$SNAP"*.artifactbundle 2>/dev/null | head -1 || true); [ -n "$b" ] && { echo "$b"; return 0; }; done; return 1; }
BUNDLE=$(find_bundle || true)
if [ -z "$BUNDLE" ]; then
    echo "Installing the official Android SDK for $SNAP (one-time, ~330MB)..."
    SWIFT swift sdk install "$SDK_URL" --checksum "$SDK_SUM"
    BUNDLE=$(find_bundle || true)
fi
[ -n "$BUNDLE" ] || { echo "error: Android SDK bundle for $SNAP not found after install" >&2; exit 1; }

# LiteRT android libs used only while linking each ABI. ai.desertant:core owns
# the copies packaged into the app.
LITERT_VER="${usage_litert_version:-2.1.6}"
if [ ! -f "Vendor/litert/lib/android-aarch64/libLiteRt.so" ] || [ ! -f "Vendor/litert/lib/android-x86_64/libLiteRt.so" ]; then
    echo "Fetching LiteRT $LITERT_VER android libs (one-time)..."
    tmp=$(mktemp -d)
    curl -fSL -o "$tmp/litert.aar" "https://dl.google.com/dl/android/maven2/com/google/ai/edge/litert/litert/$LITERT_VER/litert-$LITERT_VER.aar"
    ( cd "$tmp" && unzip -qo litert.aar )
    for pair in "arm64-v8a:aarch64" "x86_64:x86_64"; do
        abi=${pair%:*}; arch=${pair#*:}
        mkdir -p "Vendor/litert/lib/android-$arch"
        cp "$tmp/jni/$abi/libLiteRt.so" "Vendor/litert/lib/android-$arch/libLiteRt.so"
    done
    rm -rf "$tmp"
fi

# Strip tool: prefer llvm-strip/llvm-objcopy on PATH or in the Swift toolchain
# bin; else the NDK's llvm-strip (the one the task downloaded into the bundle,
# or ANDROID_NDK_HOME). Both handle Android ELF on any host.
strip_bin=""; strip_mode=""
sbin=$(dirname "$(command -v swift)")
for c in llvm-strip "$sbin/llvm-strip" llvm-objcopy "$sbin/llvm-objcopy"; do
    if command -v "$c" >/dev/null 2>&1; then
        strip_bin=$(command -v "$c")
        case "$c" in *objcopy) strip_mode=objcopy;; *) strip_mode=strip;; esac
        break
    fi
done
if [ -z "$strip_bin" ]; then
    # The finagolfin bundle ships no NDK toolchain; reuse any llvm-strip from an
    # installed Swift Android SDK's NDK, ANDROID_NDK_HOME, or $ANDROID_HOME/ndk.
    for base in "$BUNDLE" $HOME/.swiftpm/swift-sdks/* "${ANDROID_NDK_HOME:-/nonexistent}" "${ANDROID_HOME:-$HOME/Android/Sdk}/ndk" "$HOME/Library/Android/sdk/ndk"; do
        cand=$(find "$base" -name llvm-strip 2>/dev/null | head -1 || true)
        [ -n "$cand" ] && { strip_bin=$cand; strip_mode=strip; break; }
    done
fi

# ABI:arch pairs (no bash-4 associative arrays, so macOS bash 3.2 works too).
for pair in "arm64-v8a:aarch64" "x86_64:x86_64"; do
    abi=${pair%:*}
    arch=${pair#*:}
    echo "== $abi ($arch) =="
    # No -resource-dir override: the SDK descriptor declares sdkRootPath and
    # swiftStaticResourcesPath per triple, and SwiftPM applies the static one for
    # -static-stdlib. Overriding it by hand clobbers the sysroot association and
    # breaks the Android overlay's SwiftAndroid module.
    # --static-swift-stdlib (SwiftPM), not -Xswiftc -static-stdlib: the latter only
    # tells the compiler, so SwiftPM still resolved swiftResourcesPath (the
    # dynamic swift-<arch> dir) and the driver could not find
    # android/static-stdlib-args.lnk, which only exists under swift_static-<arch>.
    # Swift's static runtime response file asks for the C++ standard library by
    # its driver alias. Put the NDK static archive under both possible aliases
    # so model AARs never collide over libc++_shared.so.
    cxx_static=$(find -L "$BUNDLE" -path "*$arch-linux-android*" -name libc++_static.a 2>/dev/null | head -1 || true)
    if [ -z "$cxx_static" ]; then
        for base in "${ANDROID_NDK_HOME:-/nonexistent}" "${ANDROID_HOME:-$HOME/Android/Sdk}/ndk" "$HOME/Library/Android/sdk/ndk"; do
            cxx_static=$(find -L "$base" -path "*$arch-linux-android*" -name libc++_static.a 2>/dev/null | head -1 || true)
            [ -n "$cxx_static" ] && break
        done
    fi
    [ -n "$cxx_static" ] || { echo "error: libc++_static.a for $arch not found" >&2; exit 1; }
    cxx_link=$(mktemp -d)
    ln -s "$cxx_static" "$cxx_link/libc++.a"
    ln -s "$cxx_static" "$cxx_link/libc++_shared.a"
    ln -s "$cxx_static" "$cxx_link/libstdc++.a"
    ln -s "$cxx_static" "$cxx_link/libstdc++_shared.a"

    SWIFT swift build -c release --product {{ vars.product | default(value=env.DAL_PRODUCT) }}Android --swift-sdk "$arch-unknown-linux-android$API" --static-swift-stdlib \
        -Xlinker -LVendor/litert/lib/android-$arch -Xlinker "-L$cxx_link"
    rm -rf "$cxx_link"

    dest="$KOTLIN/jniLibs/$abi"
    rm -rf "$dest" && mkdir -p "$dest"
    # Locate the built library rather than hardcoding a layout: Swift 6.4's build
    # system emits .build/out/Products/Release-android-<arch>/, older SwiftPM used
    # .build/<triple>/release/. Both contain the arch, so match on that.
    built=$(find .build -type f -name "lib{{ vars.product | default(value=env.DAL_PRODUCT) }}Android.so" -path "*$arch*" 2>/dev/null | head -1)
    [ -n "$built" ] || { echo "error: lib{{ vars.product | default(value=env.DAL_PRODUCT) }}Android.so for $arch not found under .build" >&2; exit 1; }
    cp "$built" "$dest/"

    so="$dest/lib{{ vars.product | default(value=env.DAL_PRODUCT) }}Android.so"
    if [ "$strip_mode" = objcopy ]; then
        "$strip_bin" --strip-unneeded "$so" "$so.s" && mv "$so.s" "$so"
    elif [ "$strip_mode" = strip ]; then
        "$strip_bin" --strip-unneeded "$so"
    else
        echo "warning: no LLVM strip tool found; shipping an unstripped library" >&2
    fi
done

# The AAR ships no model: it downloads the pinned revision on first use. Remove
# any model files an older build staged into the AAR's classpath resources.
rm -rf "$KOTLIN/resources"

du -sh "$KOTLIN/jniLibs"
echo "done: {{ vars.model | default(value=env.DAL_MODEL) }}-kotlin native libs are ready for the AAR build"
"""
