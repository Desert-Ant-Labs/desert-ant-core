# Every build, test, and publish step in this repo is a mise task, so CI runs
# exactly what you run locally. The tasks themselves live in mise-tasks/ as
# ordinary shell scripts (`mise tasks` lists them, `mise tasks info <name>` shows
# one), sharing Tools/dal.sh.
#
#   mise run test:swift          the suite on this host (macOS: Core ML, Linux: LiteRT)
#   mise run test:ios            the suite on an iOS Simulator
#   mise run test:wasi           the suite on wasm32-unknown-wasi under Node
#   mise run test:android        the on-device suites (needs an emulator/device)
#   mise run test:js             the @desert-ant-labs/core unit tests
#   mise run test:node           each model's npm package against its native core
#   mise run test:browser        each model's browser path in headless Chromium
#   mise run test:bundles        every npm package through the real bundlers
#
#   mise run build:swift [model] Swift targets, one model at a time
#   mise run build:wasm  [model] the browser core -> packages/<model>-node/dist
#   mise run build:node-native   the server-side native core, for this host
#   mise run build:android       ai.desertant:core plus every model AAR
#
# Model arguments accept a model name or `all` (the default). The model list is
# never written down: it is Sources/<Product>/Catalog.swift, and what a model
# ships is whether packages/<model>-node and packages/<model>-kotlin exist.
#
# Releasing is one tag. `mise run set-version X.Y.Z`, commit, push `vX.Y.Z`, and
# .github/workflows/release.yml publishes everything at that version: the GitHub
# Release (which is the SwiftPM release), ai.desertant:* on Maven Central, and
# @desert-ant-labs/* on npm. VERSION is the single source of that number.
#
# Toolchains differ per task on purpose. test:swift and test:ios use the full
# Xcode toolchain (Apple frameworks, Core ML), so they pin no mise `swift`. The
# wasm and Android tasks pin a swift.org toolchain, because they need its clang
# and a matching cross-compilation SDK, which only exist for released versions.
# Each toolchain gets its own SwiftPM scratch directory (.build-host,
# .build-android, .build for wasm) so their artifacts never collide.

[env]
# Non-empty also vendors the LiteRT GPU accelerator sibling on Linux.
DAL_GPU = ""

[tasks.build]
description = "Build every artifact this host can build"
depends = ["build:swift", "build:wasm", "build:node-native", "build:android"]

[tasks.test]
description = "Run every check and test suite that needs no device or simulator"
depends = [
    "check:version",
    "check:isolation",
    "test:swift",
    "test:wasi",
    "test:js",
    "test:node",
    "test:browser",
    "test:bundles",
]
