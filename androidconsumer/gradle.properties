# Packaging the debug APK, every model's natives and LiteRT uncompressed
# (about 590 MB), ran a 2 GB daemon out of memory.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
# Compile in the build's own process. A Kotlin daemon takes the same 8 GB
# ceiling by default and outlives the build (check:android-consumer runs
# without a Gradle daemon); the fixture is too small to need one.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
